<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAMEWISE Labs · Nombre de la demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Tokens del manual de marca GAMEWISE v1.1 */
:root{
  color-scheme:dark;
  --bg:#0F1219;--side:#141821;--card:#191D27;--hi:#20252F;--tip:#2A3142;--line:#262C38;--mute:#313847;
  --ink:#F1F3F7;--ink2:#A3ABBA;--ink3:#858EA0;
  --acc:#12BEF2;     /* cian: marca y acciones (botones, foco, meta, progreso) */
  --accp:#0A8EC0;    /* cian presionado */
  --blue:#2F8BFF;    /* azul: SOLO datos (lado CT, series de gráficos, etiqueta Dato) */
  --green:#6FD36B;   /* mejora, victoria */
  --red:#E5574F;     /* derrota, empeora */
  --purple:#B48CF2;  /* empate */
  --warn:#F2A93B;    /* SOLO advertencias, como "datos de ejemplo" */
  --fb:Barlow,system-ui,sans-serif;
  --fc:'Barlow Semi Condensed',Barlow,system-ui,sans-serif;
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;padding:14px max(4vw,16px);border-bottom:1px solid var(--line);background:var(--side)}
.brand{font:700 20px/1 var(--fc);letter-spacing:.05em}.brand b{color:var(--acc)}
.back{color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}.back:hover{color:var(--acc)}
main{padding:28px max(4vw,16px) 56px;max-width:1240px;margin:0 auto}
.note{display:inline-flex;gap:8px;align-items:center;color:var(--warn);background:rgba(242,169,59,.09);border:1px solid rgba(242,169,59,.35);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600}
h1{font:700 clamp(28px,3.4vw,40px)/1.08 var(--fc);margin:12px 0 8px;text-wrap:balance}
.lede{color:var(--ink2);max-width:70ch;margin:0 0 20px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{background:var(--acc);color:#0F1219;font-weight:700;border:0;border-radius:10px;padding:10px 16px;min-height:44px}
.btn:hover{background:#3fcdf6}.btn:active{background:var(--accp)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.k{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.k.f{background:rgba(47,139,255,.16);color:#86b9ff}   /* Dato */
.k.i{background:var(--mute);color:var(--ink2)}        /* Interpretación */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">GAME<b>WISE</b> LABS</div>
  <span style="flex:1"></span>
  <a class="back" href="../../index.html">← Volver a Labs</a>
</header>
<main>
  <span class="note">⚠ Ejemplo · datos simulados</span>
  <h1>El hallazgo o la idea, dicho en una frase</h1>
  <p class="lede">Qué muestra esta demo y qué problema del jugador resuelve.</p>

  <div class="card">
    <p class="lbl">Sección</p>
    <p>Acá va la demo.</p>
    <p><span class="k f">Dato</span> Algo que sale de los datos. <span class="k i">Interpretación</span> Algo que deduce el coach.</p>
    <button class="btn" id="accion">Acción principal</button>
    <button class="btn ghost">Secundaria</button>
  </div>
</main>
<script>
{
  // Código de la demo. Mantenelo todo en este archivo.
  document.querySelector('#accion').addEventListener('click', () => {
    document.querySelector('.lede').textContent = 'Funciona.';
  });
}
</script>
</body>
</html>
